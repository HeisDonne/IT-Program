components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

openapi: 3.0.3
info:
  title: Authentication API
  version: 1.0.0
  description: Register, verify, log in and access protected routes.
paths:
  /register:
    post:
      summary: Create an account
      description: Creates an unverified account and emails a 6-digit code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  minLength: 6
                  maxLength: 72
          responses:
        "201":
          description: Request accepted. A code is emailed if the address can be registered. The answer is the same whether or not the email already has an account.
        "400":
          description: Invalid input
        "429":
          description: Too many requests

  /verify-otp:
    post:
      summary: Verify an account with the emailed code
      description: Marks the account as verified. After 5 wrong guesses the code stops working and a new one must be requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  maxLength: 255
                otp:
                  type: string
                  maxLength: 6
      responses:
        "200":
          description: Account verified (or already verified)
        "400":
          description: Invalid input, wrong code, or expired code
        "429":
          description: Too many wrong attempts, or too many requests

  /resend-otp:
    post:
      summary: Send a new verification code
      description: Issues a fresh code and resets the attempt counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 255
            responses:
        "200":
          description: A new code is sent if the account exists and is unverified. The answer is the same either way.
        "400":
          description: Invalid input
        "429":
          description: Too many requests

  /login:
    post:
      summary: Log in and get an access token
      description: Only verified accounts can log in. The token lasts 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 72

      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        "400":
          description: Invalid input
        "401":
          description: Wrong email or password
        "403":
          description: Email not verified yet
        "429":
          description: Too many requests

  /profile:
    get:
      summary: Get the logged-in user's details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
        "401":
          description: Token missing, expired, or revoked
        "404":
          description: User not found
        "422":
          description: Token malformed
          
  /logout:
    post:
      summary: Log out (revokes the current token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
        "401":
          description: Token missing, expired, or revoked
        "422":
          description: Token malformed